name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image_base: ${{ steps.meta.outputs.image_base }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag and lowercase image base
        id: meta
        run: |
          echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "image_base=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # ---------- API ----------
      - name: Build & push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_base }}/api:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_base }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # ---------- WEB ----------
      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=https://api.88.222.245.88.sslip.io
            VITE_AUTH0_DOMAIN=${{ secrets.AUTH0_DOMAIN }}
            VITE_AUTH0_CLIENT_ID=${{ secrets.AUTH0_CLIENT_ID }}
            VITE_AUTH0_AUDIENCE=${{ secrets.AUTH0_AUDIENCE }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_base }}/web:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_base }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for compose file)
        uses: actions/checkout@v4

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 88.222.245.88
          username: root
          key: ${{ secrets.VPS_SSH_KEY_1 }}
          source: "docker-compose.prod.yml"
          target: "~/snb/"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
          GHCR_REPO: ${{ secrets.GHCR_REPO }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
          PHILSMS_API_TOKEN: ${{ secrets.PHILSMS_API_TOKEN }}
          PHILSMS_SENDER_ID: ${{ secrets.PHILSMS_SENDER_ID }}
        with:
          host: 88.222.245.88
          username: root
          key: ${{ secrets.VPS_SSH_KEY_1 }}
          envs: IMAGE_TAG,GHCR_REPO,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,AUTH0_DOMAIN,AUTH0_AUDIENCE,PHILSMS_API_TOKEN,PHILSMS_SENDER_ID
          script: |
            set -euo pipefail
            mkdir -p ~/snb
            cd ~/snb
            # Generate .env from GitHub secrets each deploy
            cat > .env <<EOF
            IMAGE_TAG=${IMAGE_TAG}
            GHCR_REPO=${GHCR_REPO}
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=${POSTGRES_DB}
            AUTH0_DOMAIN=${AUTH0_DOMAIN}
            AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
            PHILSMS_API_TOKEN=${PHILSMS_API_TOKEN}
            PHILSMS_SENDER_ID=${PHILSMS_SENDER_ID}
            EOF
            chmod 600 .env
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
