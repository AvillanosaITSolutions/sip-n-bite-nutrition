server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache the hashed JS/CSS/font/image assets
  location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|svg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback — every other URL should serve index.html so React Router can take over.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Don't cache the index — it points at hashed assets.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
