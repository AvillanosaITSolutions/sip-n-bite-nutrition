# Production stack — API + Web on the VPS.
# Reuses the existing Postgres (visa-reminder-postgres) on the external
# network visa-reminder_default. No own postgres/traefik to avoid port clashes.
#
# Required env vars (provided by ~/snb/.env, written by CI from GitHub secrets):
#   GHCR_REPO       — e.g. ghcr.io/owner/repo
#   IMAGE_TAG       — image tag to deploy (set by CI to the git SHA)
#   POSTGRES_USER   — existing postgres user (postgres)
#   POSTGRES_PASSWORD
#   POSTGRES_DB     — the NEW database created for this app
#   AUTH0_DOMAIN / AUTH0_AUDIENCE

name: snb-prod

services:
  # ============== API (NestJS) ==============
  api:
    image: ${GHCR_REPO}/api:${IMAGE_TAG:-latest}
    container_name: snb-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      WEB_ORIGIN: http://88.222.245.88:8090
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@visa-reminder-postgres:5432/${POSTGRES_DB}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      PAYMONGO_SECRET_KEY: ${PAYMONGO_SECRET_KEY:-}
      PAYMONGO_WEBHOOK_SECRET: ${PAYMONGO_WEBHOOK_SECRET:-}
      PHILSMS_API_TOKEN: ${PHILSMS_API_TOKEN:-}
      PHILSMS_SENDER_ID: ${PHILSMS_SENDER_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "3001:3000"
    volumes:
      - snb-uploads:/app/uploads
    networks:
      - visa-reminder_default

  # ============== Web (Nginx + Vite build) ==============
  web:
    image: ${GHCR_REPO}/web:${IMAGE_TAG:-latest}
    container_name: snb-web
    restart: unless-stopped
    ports:
      - "8090:80"
    networks:
      - visa-reminder_default

networks:
  visa-reminder_default:
    external: true

volumes:
  snb-uploads:
