# Production stack — API + Web on the VPS.
# Routes through the EXISTING visa-reminder-traefik (certresolver "letsencrypt")
# and reuses the existing Postgres, all on the external visa-reminder_default network.
# HTTPS via sslip.io hostnames (free, no domain needed):
#   web → https://88.222.245.88.sslip.io
#   api → https://api.88.222.245.88.sslip.io
#
# Required env vars (~/snb/.env, written by CI from GitHub secrets):
#   GHCR_REPO, IMAGE_TAG, POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB,
#   AUTH0_DOMAIN, AUTH0_AUDIENCE

name: snb-prod

services:
  # ============== API (NestJS) ==============
  api:
    image: ${GHCR_REPO}/api:${IMAGE_TAG:-latest}
    container_name: snb-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Comma-separated allowlist: production web app + local dev servers
      # (Vite web on 5173, Expo web on 8081/8082) so browser-based dev can hit the API.
      WEB_ORIGIN: https://88.222.245.88.sslip.io,http://localhost:5173,http://localhost:8081,http://localhost:8082
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@visa-reminder-postgres:5432/${POSTGRES_DB}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      PAYMONGO_SECRET_KEY: ${PAYMONGO_SECRET_KEY:-}
      PAYMONGO_WEBHOOK_SECRET: ${PAYMONGO_WEBHOOK_SECRET:-}
      PHILSMS_API_TOKEN: ${PHILSMS_API_TOKEN:-}
      PHILSMS_SENDER_ID: ${PHILSMS_SENDER_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - snb-uploads:/app/uploads
    networks:
      - visa-reminder_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=visa-reminder_default"
      - "traefik.http.routers.snb-api.rule=Host(`api.88.222.245.88.sslip.io`)"
      - "traefik.http.routers.snb-api.entrypoints=websecure"
      - "traefik.http.routers.snb-api.tls=true"
      - "traefik.http.routers.snb-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.snb-api.loadbalancer.server.port=3000"

  # ============== Web (Nginx + Vite build) ==============
  web:
    image: ${GHCR_REPO}/web:${IMAGE_TAG:-latest}
    container_name: snb-web
    restart: unless-stopped
    networks:
      - visa-reminder_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=visa-reminder_default"
      - "traefik.http.routers.snb-web.rule=Host(`88.222.245.88.sslip.io`)"
      - "traefik.http.routers.snb-web.entrypoints=websecure"
      - "traefik.http.routers.snb-web.tls=true"
      - "traefik.http.routers.snb-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.snb-web.loadbalancer.server.port=80"

networks:
  visa-reminder_default:
    external: true

volumes:
  snb-uploads:
